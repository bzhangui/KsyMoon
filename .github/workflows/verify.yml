name: Verify KsyMoon

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  moonbit-0-10-19:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MOONBIT_VERSION: "0.10.19+97801ee1b"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install pinned Kaitai reference runtime
        run: python -m pip install kaitaistruct==0.11
      - name: Verify parsers and Kaitai compatibility
        shell: bash
        run: |
          set -euo pipefail
          export MOON_HOME="$RUNNER_TEMP/moonbit"
          export MOON_TOOLCHAIN_ROOT="$MOON_HOME"
          export PATH="$MOON_HOME/bin:$PATH"
          installer="$RUNNER_TEMP/install-moonbit.sh"
          curl --fail --silent --show-error --location --retry 3 \
            https://cli.moonbitlang.com/install/unix.sh --output "$installer"
          bash "$installer" "$MOONBIT_VERSION"
          moon version --all
          compiler="$(moonc -v)"
          if [[ "$compiler" != "v$MOONBIT_VERSION ("* ]]; then
            printf 'Expected moonc v%s, got %s\n' "$MOONBIT_VERSION" "$compiler" >&2
            exit 1
          fi
          node scripts/verify.mjs --kaitai-reference
          python scripts/native-cli-check.py
          python scripts/module-process-reference.py
          python scripts/numeric-endian-reference.py
          python scripts/expression-validation-reference.py
          python scripts/type-parameter-reference.py
          python scripts/corpus-runtime-reference.py
          python scripts/reader-context-reference.py
          python scripts/layout-navigation-reference.py
          python scripts/compatibility-report.py --runtime-report
          node examples/quickstart/run.mjs --source --all-targets
          python scripts/wav-reference.py --all-scenarios
          python scripts/image-reference.py
          python scripts/zip-reference.py
          python scripts/midi-jpeg-reference.py
          python scripts/package-check.py
      - name: Upload complete compatibility inventory
        uses: actions/upload-artifact@v4
        with:
          name: kaitai-compatibility-inventory
          path: |
            _build/compatibility-report.json
            _build/package-content-report.json
            _build/wav-reference-report.json
            _build/module-process-report.json
            _build/numeric-endian-report.json
            _build/expression-validation-report.json
            _build/type-parameter-report.json
            _build/native-cli-report.json
            _build/image-reference-report.json
            _build/extended-runtime-report.json
            _build/reader-context-reference-report.json
            _build/layout-navigation-reference-report.json
            _build/zip-reference-report.json
            _build/midi-jpeg-reference-report.json
          if-no-files-found: error
