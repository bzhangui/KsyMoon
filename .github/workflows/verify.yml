name: Verify KsyMoon

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  moonbit-0-10-19:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MOONBIT_VERSION: "0.10.19+97801ee1b"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install pinned MoonBit and verify the three scenarios
        shell: bash
        run: |
          set -euo pipefail
          export MOON_HOME="$RUNNER_TEMP/moonbit"
          export MOON_TOOLCHAIN_ROOT="$MOON_HOME"
          export PATH="$MOON_HOME/bin:$PATH"
          installer="$RUNNER_TEMP/install-moonbit.sh"
          curl --fail --silent --show-error --location --retry 3 \
            https://cli.moonbitlang.com/install/unix.sh --output "$installer"
          bash "$installer" "$MOONBIT_VERSION"
          moon version --all
          compiler="$(moonc -v)"
          if [[ "$compiler" != "v$MOONBIT_VERSION ("* ]]; then
            printf 'Expected moonc v%s, got %s\n' "$MOONBIT_VERSION" "$compiler" >&2
            exit 1
          fi
          node scripts/verify.mjs
